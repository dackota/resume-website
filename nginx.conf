# Full nginx config (replaces the image default) tuned for running under
# generic-app-chart's restricted pod security defaults: arbitrary non-root
# uid, readOnlyRootFilesystem, and a writable emptyDir at /tmp only — so the
# pid file and every temp path live under /tmp, and logs go to stdout/stderr.
# Same shape as consulting-spa's config.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'" always;

    # Probe endpoint for the chart's liveness/readiness checks.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Fingerprint-free static assets: cache for a week (releases roll the
    # image, and the HTML that references them is served no-cache below).
    location /assets/ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # SPA fallback: any unknown path serves the app shell.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
