{{ define "main" }}
  <h1 class="blog-h1"><span class="section-kicker"># tag: {{ .Title }}</span>{{ len .Pages }} post{{ if ne (len .Pages) 1 }}s{{ end }}</h1>

  <ul class="post-list">
    {{ range .Pages }}
      <li class="post-item">
        <a class="post-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        <div class="post-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
        </div>
        {{ with .Params.summary }}<p class="post-summary">{{ . }}</p>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
