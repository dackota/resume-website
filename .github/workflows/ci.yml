name: CI

# Build the image and smoke-test it: container starts, serves the page and
# the /healthz probe endpoint. No push — publish.yml owns that on v* tags.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: resume-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — serves index and /healthz
        run: |
          set -euo pipefail

          docker run -d --rm --name site -p 8080:8080 --read-only --tmpfs /tmp resume-website:ci

          fail() {
            echo "::error::$1"
            echo "--- container logs ---"
            docker logs site || true
            docker stop site >/dev/null 2>&1 || true
            exit 1
          }

          # Discard the body while polling: piping curl into a reader that
          # exits early is what made consulting-spa's original step flaky.
          ready=""
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:8080/healthz; then ready=1; break; fi
            sleep 0.5
          done
          [ -n "$ready" ] || fail "/healthz never came up"

          # Capture the body and match with bash `case` rather than
          # `curl | grep -q` (grep -q exits on first match, curl dies with
          # EPIPE under pipefail — timing-dependent flake).
          assert_contains() {
            path="$1"; needle="$2"; body=""
            body=$(curl -fsS "http://localhost:8080${path}") \
              || fail "GET ${path} failed"
            case "$body" in
              *"$needle"*) echo "ok: GET ${path} contains '${needle}'" ;;
              *) fail "GET ${path} did not contain '${needle}'" ;;
            esac
          }

          assert_status() {
            path="$1"; want="$2"; got=""
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            [ "$got" = "$want" ] \
              && echo "ok: GET ${path} -> ${got}" \
              || fail "GET ${path} returned ${got}, wanted ${want}"
          }

          assert_header() {
            path="$1"; header="$2"; needle="$3"; hdrs=""
            # -D- with the body discarded; curl -I would send HEAD, which nginx
            # answers without a body but also without exercising try_files the
            # same way a real reader's GET does.
            hdrs=$(curl -fsS -D- -o /dev/null "http://localhost:8080${path}") \
              || fail "GET ${path} failed"
            # Header names are case-insensitive on the wire, so compare folded.
            lower=$(printf '%s' "$hdrs" | tr '[:upper:]' '[:lower:]')
            want=$(printf '%s: %s' "$header" "$needle" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              *"$want"*) echo "ok: ${path} has ${header}: ${needle}" ;;
              *) fail "${path} missing '${header}: ${needle}'; got: ${hdrs}" ;;
            esac
          }

          assert_contains "/" "Dackota Johnson"
          assert_contains "/" "Platform Engineering Lead"
          # SPA fallback: unknown paths serve the app shell, not a 404
          assert_contains "/some/deep/link" "Dackota Johnson"
          assert_contains "/assets/styles.css" "--green"
          assert_contains "/assets/app.js" "kubectl"

          # --- blog ---
          # The highest-value assertion here is the 404: a broken location
          # /blog/ block does not error, it silently serves the resume with a
          # 200. This is the exact counterpart to the SPA-fallback assertion
          # above — together they pin where the fallback stops applying.
          assert_status "/blog/no-such-post" 404
          # Proves Hugo ran and its output landed where nginx expects; a
          # misconfigured --destination yields a /blog/ that 404s everywhere.
          assert_contains "/blog/" "Writing"
          # This post is a load-bearing fixture: CI asserts against it to prove
          # a real post rendered. Drafting or deleting it means updating these
          # two lines to point at another published post.
          # No quotes in this substring on purpose: the title contains "Good
          # Enough", which Hugo renders as typographic quotes.
          assert_contains "/blog/twelve-non-negotiables-kubernetes/" "Hardening My K8s Cluster"
          assert_contains "/blog/twelve-non-negotiables-kubernetes/" "/assets/blog.css"
          # hello-world is draft, so Hugo must not emit it at all.
          assert_status "/blog/hello-world/" 404
          assert_header "/blog/index.xml" "content-type" "application/rss+xml"
          # The version stamp now covers Hugo output too — a blog page still
          # carrying the literal placeholder means the find/sed pass missed it.
          assert_status "/assets/blog.css" 200

          docker stop site
