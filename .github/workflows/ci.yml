name: CI

# Build the image and smoke-test it: container starts, serves the page and
# the /healthz probe endpoint. No push — publish.yml owns that on v* tags.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: resume-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — serves index and /healthz
        run: |
          set -euo pipefail

          docker run -d --rm --name site -p 8080:8080 --read-only --tmpfs /tmp resume-website:ci

          fail() {
            echo "::error::$1"
            echo "--- container logs ---"
            docker logs site || true
            docker stop site >/dev/null 2>&1 || true
            exit 1
          }

          # Discard the body while polling: piping curl into a reader that
          # exits early is what made consulting-spa's original step flaky.
          ready=""
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:8080/healthz; then ready=1; break; fi
            sleep 0.5
          done
          [ -n "$ready" ] || fail "/healthz never came up"

          # Capture the body and match with bash `case` rather than
          # `curl | grep -q` (grep -q exits on first match, curl dies with
          # EPIPE under pipefail — timing-dependent flake).
          assert_contains() {
            path="$1"; needle="$2"; body=""
            body=$(curl -fsS "http://localhost:8080${path}") \
              || fail "GET ${path} failed"
            case "$body" in
              *"$needle"*) echo "ok: GET ${path} contains '${needle}'" ;;
              *) fail "GET ${path} did not contain '${needle}'" ;;
            esac
          }

          assert_contains "/" "Dackota Johnson"
          assert_contains "/" "Platform Engineering Lead"
          # SPA fallback: unknown paths serve the app shell, not a 404
          assert_contains "/some/deep/link" "Dackota Johnson"
          assert_contains "/assets/styles.css" "--green"
          assert_contains "/assets/app.js" "kubectl"

          # The OTLP endpoint exists at all only if the envsubst template
          # rendered and nginx started from /tmp/nginx.conf — so this doubles
          # as the check that the run-time config wiring still works. With no
          # HONEYCOMB_API_KEY set (as here) it must swallow the batch locally
          # rather than proxy upstream: a 502 would mean the no-key branch is
          # gone and every keyless deploy is talking to api.honeycomb.io.
          assert_status() {
            path="$1"; method="$2"; want="$3"; got=""
            got=$(curl -fsS -o /dev/null -w '%{http_code}' -X "$method" \
              -H 'Content-Type: application/json' -d '{"resourceSpans":[]}' \
              "http://localhost:8080${path}") || fail "${method} ${path} failed"
            [ "$got" = "$want" ] \
              && echo "ok: ${method} ${path} -> ${got}" \
              || fail "${method} ${path} -> ${got}, wanted ${want}"
          }

          assert_status "/v1/traces" POST 204

          docker stop site

          # Same image, key supplied: the key must reach the rendered config.
          # Checked by inspection rather than by posting upstream — CI holds no
          # Honeycomb credentials and must not depend on a third party.
          docker run -d --rm --name site-key --read-only --tmpfs /tmp \
            -e HONEYCOMB_API_KEY=ci-placeholder-key resume-website:ci
          sleep 2
          rendered=$(docker exec site-key cat /tmp/nginx.conf) \
            || { docker logs site-key || true; docker stop site-key >/dev/null 2>&1 || true; \
                 echo "::error::config was never rendered to /tmp/nginx.conf"; exit 1; }
          case "$rendered" in
            *'set $honeycomb_key "ci-placeholder-key";'*)
              echo "ok: ingest key substituted into the rendered config" ;;
            *) docker stop site-key >/dev/null 2>&1 || true
               echo "::error::HONEYCOMB_API_KEY did not reach the rendered config"; exit 1 ;;
          esac
          # envsubst must leave nginx's own variables alone.
          case "$rendered" in
            *'try_files $uri $uri/ /index.html;'*)
              echo "ok: nginx variables survived envsubst" ;;
            *) docker stop site-key >/dev/null 2>&1 || true
               echo "::error::envsubst clobbered nginx variables"; exit 1 ;;
          esac
          docker stop site-key
